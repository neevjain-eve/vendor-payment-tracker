<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendor Payment Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mute:#6b7385;--line:#e4e7ec;--acc:#4f46e5;--acc-d:#4338ca;--ok:#15803d;--okbg:#dcfce7;--no:#b91c1c;--nobg:#fee2e2;--wait:#a16207;--waitbg:#fef3c7;--blue:#1d4ed8;--bluebg:#dbeafe}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
.mute{color:var(--mute)}
small{font-size:12px}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px}
.brand span{color:var(--acc)}
.nav{display:flex;gap:4px;flex:1;margin-left:12px}
.who{text-align:right;line-height:1.2}
.who small{color:var(--mute)}
.wrap{max-width:1260px;margin:0 auto;padding:20px 24px 60px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f1f3f6}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.no{background:var(--no);border-color:var(--no);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:0;background:none;padding:6px 12px;border-radius:16px;cursor:pointer;color:var(--mute)}
.tab.on{background:#e8e9fd;color:var(--acc);font-weight:600}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.need{background:#fffbeb;border-color:#fde68a;padding:14px 16px;margin-bottom:18px}
.need h4{margin:0 0 10px;font-size:14px;color:#713f12}
.nrow{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid #fde68a;flex-wrap:wrap}
.nrow:first-of-type{border-top:0}
.nrow .nm{font-weight:600;cursor:pointer;color:var(--ink)}
.nrow .nm:hover{color:var(--acc)}
.nrow small{display:block;color:var(--mute)}
.nact{display:flex;gap:8px;align-items:center}
.denybox{min-width:300px}
.denybox textarea{width:100%}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1100px}
table.act{min-width:760px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fafbfc}
tbody tr:last-child td{border-bottom:0}
.r{text-align:right;font-variant-numeric:tabular-nums}
th.r{text-align:right}
.b{font-weight:600}
.v{font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.gray{background:#eef0f3;color:var(--mute)}.green{background:var(--okbg);color:var(--ok)}.red{background:var(--nobg);color:var(--no)}.amber{background:var(--waitbg);color:var(--wait)}.blue{background:var(--bluebg);color:var(--blue)}
.tag{display:block;font-size:12px;margin-top:2px}
.tag.red,.tag.amber,.tag.gray{background:none}
.empty{padding:50px 20px;text-align:center;color:var(--mute)}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);z-index:11;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.12);padding:22px}
.dh{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.dh h2{margin:0;font-size:19px;flex:1}
.meta{font-size:12px;color:var(--mute);margin-bottom:14px}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.kv{background:var(--bg);border-radius:8px;padding:9px 12px}
.kv small{display:block;color:var(--mute)}
.kv b{font-size:15px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:22px 0 8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#eef0f3;border-radius:12px;padding:2px 10px;margin:0 6px 6px 0;font-size:13px}
.chip i{cursor:pointer;font-style:normal;color:var(--mute)}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;flex-wrap:wrap}
.step .n{width:24px;height:24px;border-radius:50%;background:#eef0f3;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.step .t{flex:1;min-width:160px}
.step .t small{display:block;color:var(--mute)}
.box{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sum{background:#f0fdf4;border-color:#bbf7d0}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.sum span{color:var(--mute)}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:8px 0 8px 14px;border-left:2px solid var(--line);font-size:13px;position:relative}
.feed li::before{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:#c4c8d2}
.feed small{display:block;color:var(--mute)}
.feed li.cm{border-left-color:var(--acc)}
.feed li.cm::before{background:var(--acc)}
.feed li.cm .bub{background:#f3f4ff;border-radius:8px;padding:7px 10px;margin-top:3px;white-space:pre-wrap}
.cmbox{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.cmbox textarea{flex:1}
.prev{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);text-align:center}
.prev img,.prev canvas{max-width:100%;border-radius:6px}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(17,24,39,.4);padding:16px}
.mbox{background:var(--card);border-radius:14px;width:min(560px,100%);max-height:92vh;overflow-y:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mbox h2{margin:0 0 14px;font-size:18px;display:flex;align-items:center}
.mbox h2 span{flex:1}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 4px}
label.opt{display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px;color:var(--ink);margin:6px 0;cursor:pointer}
.opts{border:1px solid var(--line);border-radius:10px;padding:6px 12px}
input[type=text],input[type=password],input[type=number],input[type=date],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
select{width:auto}
input:focus,textarea:focus,select:focus{outline:2px solid #c7c9f7;border-color:var(--acc)}
input[readonly]{background:var(--bg);font-weight:600}
.pcts{font-size:12px;margin-top:4px;color:var(--mute)}
.pcts a{color:var(--acc);cursor:pointer;margin-right:8px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.note{font-size:12px;margin-top:5px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
.lbox h1{margin:0 0 4px;font-size:22px}
.lbox p{margin:0 0 10px;color:var(--mute)}
.drop{display:block;border:2px dashed #c7c9f7;border-radius:12px;padding:20px 14px;text-align:center;cursor:pointer;background:#fafaff;color:var(--mute);font-weight:400;font-size:14px;margin:0}
.drop:hover,.drop.over{border-color:var(--acc);background:#f1f1ff}
.drop b{color:var(--acc)}
.drop input{display:none}
.drop.has{border-style:solid;border-color:var(--ok);background:#f0fdf4;color:var(--ink)}
.err{color:var(--no);font-size:13px;margin-top:10px;min-height:18px}
.demo{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.hint{background:#eef2ff;border:1px solid #dfe3ff;color:#312e81;padding:9px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
.flow{display:flex;gap:4px;margin:8px 0 18px}
.fs{flex:1;text-align:center;min-width:0;padding:0 2px}
.fs .dot{width:28px;height:28px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;background:#eef0f3;color:var(--mute);font-weight:700;font-size:13px}
.fs.done .dot{background:var(--ok);color:#fff}.fs.now .dot{background:var(--acc);color:#fff}.fs.bad .dot{background:var(--no);color:#fff}
.fs b{display:block;font-size:12px}
.fs small{display:block;color:var(--mute);font-size:11px;line-height:1.3}
.fs.now small{color:var(--acc);font-weight:600}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;align-items:start}
.col{background:#eceef2;border-radius:12px;padding:10px;min-height:160px}
.ch{font-weight:600;font-size:13px;margin:2px 4px 10px}
.bc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.bc:hover{border-color:var(--acc)}
.bc small{display:block;color:var(--mute);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stats .kv{background:var(--card);border:1px solid var(--line)}
.stats .kv b{font-size:18px}
.dcard{cursor:pointer}.dcard.sel{outline:2px solid var(--pri,#2563eb)}.dcard.warn{background:#fef2f2!important;border-color:#fecaca!important}.dstats .kv b{font-size:20px;margin:2px 0}
tfoot td{font-weight:700;background:#fafbfc}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:8px;z-index:50;display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ---------- Team: edit names / usernames here. Passwords are stored as SHA-256 hashes (h) of "username:password".
   To set a new password, open the page, press F12, and run  makeHash('username','newpassword')  in the Console, then paste the result as h. ----------
   ops      = Operations team: adds & edits bills (gross amount only – never sees TDS / net payable)
   pm / mm  = Product Manager / Marketing Manager: approve or deny
   accounts = Accounts team: pays approved bills – enters TDS and UTR, bill then moves to Completed */
const USERS = [
  {u:'operations', h:'ff49daeb0ff61a39e04611c02b2dbfac2546c6db55e10245b3d3209cffcb6eae', name:'Operations Team', role:'ops'},
  {u:'accounts', h:'1b3936316c0272125c13028dd596f67b7c4b44050c85d0a521d831c8edc5d105', name:'Accounts Team', role:'accounts'},
  {u:'product', h:'892057792d97ef3057dff2efbafd9f25fe728741abfdff61186881c629b2bfb5', name:'Product Manager', role:'pm'},
  {u:'marketing', h:'7b6c98d5548f5fb36449085a7c111b6a81af516c00234858de3f7e39ddecc816', name:'Marketing Manager', role:'mm'}
];
const ROLE_LABEL = {ops:'Operations', accounts:'Accounts', pm:'Product Manager', mm:'Marketing Manager'};
const ORDER = ['pm','mm'];   // when both approve, Product Manager goes first

/* ---------- Storage (browser only; swap this block for an API later) ---------- */
const mem = {};
const store = {
  get(k){ try{ const v=localStorage.getItem(k); return v==null?(mem[k]??null):JSON.parse(v); }catch(e){ return mem[k]??null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); delete mem[k]; return true; }catch(e){ mem[k]=v; return false; } }
};

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + (Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD = d => { if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y}`; };
const fdt = iso => { if(!iso) return ''; const d=new Date(iso), p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}, ${d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}`; };
const today = () => { const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); };
const apText = arr => arr.length>1 ? arr.map(r=>ROLE_LABEL[r]).join(' → ') : ROLE_LABEL[arr[0]]+' only';
const seesTds = u => u.role!=='ops';
const hasTds = b => b.tds!==null && b.tds!==undefined;
const netOf = b => hasTds(b) ? b.amount-b.tds : null;
const pctOf = b => b.amount ? +(b.tds/b.amount*100).toFixed(2) : 0;

/* ---------- State (and upgrade of older saved data) ---------- */
function loadBills(){
  const bills = store.get('bills')||[];
  bills.forEach(b=>{
    if(b.a1){ b.approvers=['pm','sm']; b.ap={pm:b.a1,sm:b.a2}; delete b.a1; delete b.a2; }
    b.ap=b.ap||{}; ORDER.forEach(r=>{ b.ap[r]=b.ap[r]||{s:'pending'}; });
    b.dueHistory=b.dueHistory||[]; b.log=b.log||[]; b.collabs=b.collabs||[];
    if(b.ap.sm){ b.ap.mm=b.ap.sm; delete b.ap.sm; }
    b.approvers=b.approvers.map(r=>r==='sm'?'mm':r); ORDER.forEach(r=>{ b.ap[r]=b.ap[r]||{s:'pending'}; });
    ORDER.forEach(r=>{ if(b.ap[r].by==='Service Manager') b.ap[r].by='Marketing Manager'; });
    if(b.createdBy==='Service Manager') b.createdBy='Marketing Manager'; if(b.updatedBy==='Service Manager') b.updatedBy='Marketing Manager'; if(b.completedBy==='Service Manager') b.completedBy='Marketing Manager';
    b.log.forEach(l=>{ l.text=String(l.text).replace(/\b(\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d{4})\b/g,(x,d,m,y)=>String(d).padStart(2,'0')+'/'+String(MON.indexOf(m)+1).padStart(2,'0')+'/'+y); });
    b.log.forEach(l=>{ if(l.who==='Service Manager') l.who='Marketing Manager'; if(l.role==='sm') l.role='mm'; l.text=String(l.text).replace(/Service Manager/g,'Marketing Manager'); });
    if(b.tds===undefined) b.tds=null;
    if(!b.updatedAt){ const l=b.log[b.log.length-1]; b.updatedAt=l?l.t:b.createdAt; b.updatedBy=l?l.who:b.createdBy; }
  });
  return bills;
}
function loadUser(){ const s=store.get('session'); const u=s&&USERS.find(x=>x.u===s.u); return u?{u:u.u,name:u.name,role:u.role}:null; }
let S = { user:loadUser(), bills:loadBills(), view:'bills', layout:'list', month:null, filter:'all', actUser:'', open:null, denying:null, draft:null };
function save(){ if(!store.set('bills',S.bills)) toast('Storage full – changes kept for this session only'); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display='none',2600); }

/* ---------- Business rules ---------- */
const denied = b => b.approvers.some(r=>b.ap[r].s==='denied');
const allOk  = b => b.approvers.every(r=>b.ap[r].s==='approved');
const nextRole = b => b.approvers.find(r=>b.ap[r].s!=='approved');
function status(b){
  if(denied(b)) return 'Denied';
  if(b.completedAt) return 'Completed';
  if(allOk(b)) return 'Ready to pay';
  return 'Awaiting '+ROLE_LABEL[nextRole(b)];
}
function canAct(b,u){
  if(!u||denied(b)||b.completedAt) return false;
  const i=b.approvers.indexOf(u.role); if(i<0||b.ap[u.role].s!=='pending') return false;
  return b.approvers.slice(0,i).every(r=>b.ap[r].s==='approved');
}
const pendingFor = u => u ? S.bills.filter(b=>canAct(b,u)) : [];
/* priv:true = hidden from Operations (anything that mentions TDS / net payable) */
function log(b,text,o={}){
  const t=new Date().toISOString();
  b.log.push({t,who:S.user.name,role:S.user.role,text,kind:o.kind||'event',priv:!!o.priv}); b.updatedAt=t; b.updatedBy=S.user.name;
}
const visLog = b => b.log.filter(l=>seesTds(S.user)||!l.priv);
function decide(id,res,note){
  const b=S.bills.find(x=>x.id===id); if(!b||!canAct(b,S.user)) return;
  const r=S.user.role;
  b.ap[r]={s:res,by:S.user.name,at:new Date().toISOString(),note:note||''};
  log(b,(res==='approved'?'Approved':'Denied')+' as '+ROLE_LABEL[r]+(note?' – “'+note+'”':''));
  save(); toast(res==='approved'?'Approved':'Denied'); render();
}
const resetApprovals = b => ORDER.forEach(r=>{ b.ap[r]={s:'pending'}; });

/* ---------- Due-date reading ---------- */
const mk=(y,m,d)=>{ const dt=new Date(y,m,d); return dt.getFullYear()===y&&dt.getMonth()===m&&dt.getDate()===d ? `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}` : null; };
const monIdx = w => MON.findIndex(m=>m.toLowerCase()===w.slice(0,3).toLowerCase());
function parseDate(s){
  let m;
  if((m=s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return mk(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){ let y=+m[3]; if(y<100) y+=2000; return mk(y,+m[2]-1,+m[1]); }
  if((m=s.match(/(\d{1,2})(?:st|nd|rd|th)?[\s,.\-]*([A-Za-z]{3,9})[\s,.\-]*(\d{2,4})/)) && monIdx(m[2])>=0){ let y=+m[3]; if(y<100) y+=2000; return mk(y,monIdx(m[2]),+m[1]); }
  if((m=s.match(/([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})/)) && monIdx(m[1])>=0) return mk(+m[3],monIdx(m[1]),+m[2]);
  return null;
}
function findDue(text){
  const t = text.replace(/\s+/g,' ');
  const re = /(?:payment\s+due|due\s*date|due\s+on|due\s+by|pay\s+by|due)\s*[:\-–]?\s*(.{0,28})/gi; let m;
  while((m=re.exec(t))){ const d=parseDate(m[1]); if(d) return d; }
  return null;
}
const CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function pdfjs(){
  if(window.pdfjsLib) return pdfjsLib;
  await new Promise((ok,bad)=>{ const s=document.createElement('script'); s.src=CDN+'pdf.min.js'; s.onload=ok; s.onerror=bad; document.head.appendChild(s); });
  pdfjsLib.GlobalWorkerOptions.workerSrc = CDN+'pdf.worker.min.js'; return pdfjsLib;
}
async function pdfText(buf){
  const lib = await pdfjs(); const pdf = await lib.getDocument({data:buf}).promise; let t='';
  for(let i=1;i<=Math.min(pdf.numPages,3);i++){ const c=await (await pdf.getPage(i)).getTextContent(); t+=c.items.map(x=>x.str).join(' ')+'\n'; }
  return t;
}
const dataToBytes = u => { const b=atob(u.split(',')[1]); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; };
const readURL = f => new Promise((ok,bad)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=bad; r.readAsDataURL(f); });

/* ---------- Views ---------- */
const apill = a => a.s==='approved' ? '<span class="pill green">Approved</span>' : a.s==='denied' ? '<span class="pill red">Denied</span>' : '<span class="pill gray">Pending</span>';
const apCell = (b,r) => b.approvers.includes(r) ? apill(b.ap[r])+(b.ap[r].by?`<small class="mute" style="display:block">${esc(b.ap[r].by)}<br>${fdt(b.ap[r].at)}</small>`:'') : '<span class="mute">Not required</span>';
function spill(st){ const c = st==='Completed'?'green':st==='Ready to pay'?'blue':st==='Denied'?'red':'amber'; return `<span class="pill ${c}">${st}</span>`; }
function dueTag(b){
  if(b.completedAt||denied(b)) return '';
  const n = Math.round((new Date(b.due+'T00:00:00')-today())/864e5);
  if(n<0) return `<span class="tag red">Overdue by ${-n} day${n===-1?'':'s'}</span>`;
  if(n===0) return '<span class="tag red">Due today</span>';
  if(n<=3) return `<span class="tag amber">Due in ${n} day${n===1?'':'s'}</span>`;
  return `<span class="tag gray">in ${n} days</span>`;
}
/* Approve / Deny buttons – deny reason opens right here, no pop-up */
function approvalBox(b){
  if(S.denying===b.id) return `<div class="denybox"><textarea rows="2" placeholder="Reason for denial (optional)"></textarea><div class="acts" style="margin-top:8px"><button class="btn sm" data-act="dcancel">Cancel</button><button class="btn sm no" data-act="dconfirm" data-id="${b.id}">Confirm denial</button></div></div>`;
  return `<div class="nact"><button class="btn sm ok" data-act="approve" data-id="${b.id}">Approved</button><button class="btn sm no" data-act="deny" data-id="${b.id}">Denied</button></div>`;
}

function render(){
  const sc=($('.drawer')||{}).scrollTop||0;
  if(!S.user){ $('#app').innerHTML = loginView(); document.title='Vendor Payment Tracker'; return; }
  const u=S.user, mine=pendingFor(u);
  document.title=(mine.length?`(${mine.length}) `:'')+'Vendor Payment Tracker';
  $('#app').innerHTML = `
  <div class="top">
    <div class="brand">Vendor <span>Payments</span></div>
    <div class="nav"><button class="tab ${S.view==='dash'?'on':''}" data-act="view" data-id="dash">Dashboard</button><button class="tab ${S.view==='bills'?'on':''}" data-act="view" data-id="bills">Bills</button><button class="tab ${S.view==='txn'?'on':''}" data-act="view" data-id="txn">Transactions</button><button class="tab ${S.view==='activity'?'on':''}" data-act="view" data-id="activity">Activity</button></div>
    <div class="who">${esc(u.name)}<br><small>${ROLE_LABEL[u.role]}</small></div>
    <button class="btn" data-act="refresh" title="Reload the latest version and data">⟳ Refresh</button><button class="btn" data-act="logout">Log out</button>
  </div>
  <div class="wrap">${S.view==='activity'?activityView():S.view==='txn'?txnView():S.view==='dash'?dashView():billsView(mine)}</div>
  ${S.open?drawer(S.bills.find(b=>b.id===S.open)):''}`;
  const dr=$('.drawer'); if(dr) dr.scrollTop=sc;
  if(S.open){ const b=S.bills.find(x=>x.id===S.open); if(b&&b.doc&&b.doc.type==='application/pdf') previewPdf(b); }
}

function who(name,at){ return name?`<b>${esc(name)}</b><small class="mute" style="display:block">${fdt(at)}</small>`:'<span class="mute">—</span>'; }
const HINT = {
  ops:'<b>Your part:</b> add each vendor bill with the <b>gross amount</b>. It goes to the approver(s), then to Accounts for payment.',
  accounts:'<b>Your part:</b> pay the approved bills – enter the <b>TDS</b> and the <b>UTR</b>; net payable is worked out for you. Paid bills move to <b>Completed</b>.',
  pm:'<b>Your part:</b> approve or deny the bills waiting for you. Approved bills go on to Accounts for payment.',
  mm:'<b>Your part:</b> approve or deny the bills waiting for you. Approved bills go on to Accounts for payment.'
};
function stageLine(b){
  const st=status(b);
  if(st==='Completed') return `Paid on ${fdt(b.completedAt)}`;
  if(st==='Denied'){ const r=b.approvers.find(x=>b.ap[x].s==='denied'); return `Denied by ${esc(b.ap[r].by)} · ${fdt(b.ap[r].at)}`; }
  if(st==='Ready to pay') return 'Waiting for Accounts to pay';
  return 'Waiting for '+ROLE_LABEL[nextRole(b)];
}
function boardView(){
  const tds=seesTds(S.user);
  const cols=[['Awaiting approval',b=>status(b).startsWith('Awaiting')],['Ready to pay',b=>status(b)==='Ready to pay'],['Completed',b=>status(b)==='Completed'],['Denied',b=>status(b)==='Denied']];
  const card=b=>`<div class="bc" data-act="open" data-id="${b.id}"><b>${esc(b.vendor)}</b><div>${inr(b.amount)}${tds&&hasTds(b)?` <small style="display:inline">· net ${inr(netOf(b))}</small>`:''}</div>
    <small>Added by ${esc(b.createdBy)} · ${fdt(b.createdAt)}</small><small>${stageLine(b)}</small>${b.utr?`<small>UTR ${esc(b.utr)}</small>`:''}${b.completedAt?'':`<small>Due ${fmtD(b.due)}</small>${dueTag(b)}`}</div>`;
  return `<div class="board">${cols.map(([t,fn])=>{ const items=S.bills.filter(fn).sort((a,b)=>a.due.localeCompare(b.due));
    return `<div class="col"><div class="ch">${t} <span class="mute">${items.length}</span></div>${items.map(card).join('')||'<div class="mute" style="padding:6px 4px">Nothing here</div>'}</div>`; }).join('')}</div>`;
}
function billsView(mine){
  const u=S.user, tds=seesTds(u), board=S.layout==='board';
  const tabs=[['all','All'],['wait','Awaiting approval'],['ready','Ready to pay'],['done','Completed'],['den','Denied']];
  const f={all:()=>true, wait:b=>status(b).startsWith('Awaiting'), ready:b=>status(b)==='Ready to pay', done:b=>status(b)==='Completed', den:b=>status(b)==='Denied'};
  const list=S.bills.filter(f[S.filter]).sort((a,b)=>(!!a.completedAt-!!b.completedAt)||a.due.localeCompare(b.due));
  const need = mine.length ? `<div class="card need"><h4>⏰ Waiting for your approval (${mine.length})</h4>${mine.map(b=>`<div class="nrow"><div><span class="nm" data-act="open" data-id="${b.id}">${esc(b.vendor)}</span>
      <small>Gross ${inr(b.amount)} · Due ${fmtD(b.due)} · added by ${esc(b.createdBy)} · ${fdt(b.createdAt)}</small></div>${approvalBox(b)}</div>`).join('')}</div>` : '';
  const toPay = u.role==='accounts' ? S.bills.filter(b=>allOk(b)&&!denied(b)&&!b.completedAt) : [];
  const payBox = toPay.length ? `<div class="card need" style="background:#eff6ff;border-color:#bfdbfe"><h4 style="color:#1e3a8a">💰 Ready for your payment (${toPay.length})</h4>${toPay.map(b=>`<div class="nrow" style="border-color:#bfdbfe"><div><span class="nm" data-act="open" data-id="${b.id}">${esc(b.vendor)}</span>
      <small>Gross ${inr(b.amount)} · Due ${fmtD(b.due)} · approved by ${b.approvers.map(r=>esc(b.ap[r].by)).join(', ')}</small></div><button class="btn sm pri" data-act="open" data-id="${b.id}">Add TDS &amp; pay</button></div>`).join('')}</div>` : '';
  const rowTds = b => tds ? `<td class="r">${hasTds(b)?inr(b.tds):'<span class="mute">—</span>'}</td><td class="r b">${hasTds(b)?inr(netOf(b)):'<span class="mute">—</span>'}</td>` : '';
  const table = list.length?`<table><thead><tr><th>Vendor</th><th class="r">Gross amount</th>${tds?'<th class="r">TDS</th><th class="r">Net payable</th>':''}<th>Due date</th><th>Added by</th><th>${ROLE_LABEL.pm}</th><th>${ROLE_LABEL.mm}</th><th>Paid on · UTR</th><th>Status</th></tr></thead><tbody>
      ${list.map(b=>{const nc=b.log.filter(l=>l.kind==='comment').length; return `<tr data-act="open" data-id="${b.id}"><td class="v">${esc(b.vendor)}${nc?` <small class="mute">💬 ${nc}</small>`:''}</td><td class="r">${inr(b.amount)}</td>${rowTds(b)}<td>${fmtD(b.due)}${b.dueHistory.length?' <small class="mute" title="Due date was changed">✎</small>':''}${dueTag(b)}</td><td>${who(b.createdBy,b.createdAt)}</td><td>${apCell(b,'pm')}</td><td>${apCell(b,'mm')}</td><td>${b.completedAt?`<b>${fdt(b.completedAt)}</b><small class="mute" style="display:block">UTR ${esc(b.utr)}</small>`:'<span class="mute">—</span>'}</td><td>${spill(status(b))}</td></tr>`;}).join('')}
      </tbody></table>`:`<div class="empty">${S.bills.length?'No bills in this view.':(u.role==='ops'?'No bills yet. Click “+ New bill” to add the first one.':'No bills yet.')}</div>`;
  return `<div class="hint">${HINT[u.role]}</div>${need}${payBox}<div class="bar">
      ${board?'<b style="font-size:15px">Board</b>':tabs.map(([k,l])=>`<button class="tab ${S.filter===k?'on':''}" data-act="tab" data-id="${k}">${l} <span class="mute">${S.bills.filter(f[k]).length}</span></button>`).join('')}
      <span class="sp"></span>
      <button class="tab ${board?'':'on'}" data-act="layout" data-id="list">☰ List</button><button class="tab ${board?'on':''}" data-act="layout" data-id="board">▦ Board</button>
      ${u.role==='ops'?'<button class="btn pri" data-act="new" style="margin-left:8px">+ New bill</button>':''}
    </div>${board?boardView():`<div class="card tw">${table}</div>`}`;
}

const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ymKey = iso => { const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const monthName = ym => { const [y,m]=ym.split('-'); return MONF[+m-1]+' '+y; };
function dashView(){
  const t0=today(), DAY=864e5;
  const dd=d=>{const [y,m,x]=d.split('-'); return Math.round((new Date(+y,+m-1,+x)-t0)/DAY);};
  const open=S.bills.filter(b=>!b.completedAt&&!denied(b)&&b.due);
  const m=S.dmonth||'';
  const base=m?open.filter(b=>b.due.slice(0,7)===m):open;
  const defs=[['over','Overdue',d=>d<0],['today','Today',d=>d===0],['w1','Next week',d=>d>=1&&d<=7],['w2','Week 2',d=>d>=8&&d<=14],['w3','Week 3',d=>d>=15&&d<=21],['w4','Week 4',d=>d>=22&&d<=28]];
  const rng={over:'before today',today:fmtD(ymd(t0)),w1:fmtD(ymd(new Date(+t0+DAY)))+' – '+fmtD(ymd(new Date(+t0+7*DAY))),w2:fmtD(ymd(new Date(+t0+8*DAY)))+' – '+fmtD(ymd(new Date(+t0+14*DAY))),w3:fmtD(ymd(new Date(+t0+15*DAY)))+' – '+fmtD(ymd(new Date(+t0+21*DAY))),w4:fmtD(ymd(new Date(+t0+22*DAY)))+' – '+fmtD(ymd(new Date(+t0+28*DAY)))};
  const groups=defs.map(([k,l,f])=>{const list=base.filter(b=>f(dd(b.due))); return {k,l,list,sum:list.reduce((x,b)=>x+b.amount,0),ready:list.filter(allOk).length};});
  const sel=S.dbk&&groups.find(g=>g.k===S.dbk);
  const shown=(m&&!sel?base:(sel?sel.list:groups.filter(g=>g.k!=='over'||g.list.length).flatMap(g=>g.list))).slice().sort((a,b)=>a.due.localeCompare(b.due));
  const months=[...new Set(open.map(b=>b.due.slice(0,7)))].sort();
  const cards=groups.map(g=>`<div class="kv dcard ${S.dbk===g.k?'sel':''} ${g.k==='over'&&g.list.length?'warn':''}" data-act="dbk" data-id="${g.k}"><small>${g.l}</small><b>${inr(g.sum)}</b><small>${g.list.length} bill${g.list.length===1?'':'s'}${g.list.length?` · ${g.ready} approved`:''}</small><small class="mute">${rng[g.k]}</small></div>`).join('');
  const total=base.reduce((x,b)=>x+b.amount,0);
  const table=shown.length?`<table><thead><tr><th>Due date</th><th>Vendor</th><th class="r">Amount to arrange</th><th>Status</th></tr></thead><tbody>${shown.map(b=>`<tr data-act="open" data-id="${b.id}"><td>${fmtD(b.due)}${dueTag(b)}</td><td class="v">${esc(b.vendor)}</td><td class="r b">${inr(b.amount)}</td><td>${spill(status(b))}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">Total · ${shown.length} bill${shown.length===1?'':'s'}</td><td class="r">${inr(shown.reduce((x,b)=>x+b.amount,0))}</td><td></td></tr></tfoot></table>`:`<div class="empty">No pending payments${m?' due in '+monthName(m):' in this period'}.</div>`;
  return `<div class="bar"><b style="font-size:16px">Payments to arrange</b><span class="sp"></span><label style="margin:0">Month&nbsp;</label><input type="month" data-sel="dmonth" value="${m}" style="width:auto">${m?'<button class="btn sm" data-act="dclear">All</button>':''}</div>
  ${months.length?`<div class="bar">${months.map(k=>`<button class="tab ${k===m?'on':''}" data-act="dmon" data-id="${k}">${monthName(k)}</button>`).join('')}</div>`:''}
  <div class="stats dstats">${cards}</div>
  <div class="bar"><small class="mute">${m?monthName(m)+': ':'All pending: '}<b>${inr(total)}</b> across ${base.length} bill${base.length===1?'':'s'} · amounts are gross bill amounts of unpaid bills by due date; TDS is applied by Accounts when paying.${sel?' · Showing '+sel.l+' (click it again to show all).':''}</small></div>
  <div class="card tw">${table}</div>`;
}
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function txnView(){
  const tds=seesTds(S.user);
  const done=S.bills.filter(b=>b.completedAt);
  const counts={}; done.forEach(b=>{ const k=ymKey(b.completedAt); counts[k]=(counts[k]||0)+1; });
  const keys=Object.keys(counts).sort().reverse();
  const m=S.month||keys[0]||ymKey(new Date().toISOString());
  const list=done.filter(b=>ymKey(b.completedAt)===m).sort((a,b)=>a.completedAt.localeCompare(b.completedAt));
  const G=list.reduce((x,b)=>x+b.amount,0), T=list.reduce((x,b)=>x+(b.tds||0),0);
  const table=list.length?`<table><thead><tr><th>#</th><th>Paid on</th><th>Vendor</th><th class="r">Gross amount</th>${tds?'<th class="r">TDS</th><th class="r">Net paid</th>':''}<th>UTR</th><th>Approved by</th></tr></thead><tbody>
    ${list.map((b,i)=>`<tr data-act="open" data-id="${b.id}"><td>${i+1}</td><td style="white-space:nowrap">${fdt(b.completedAt)}</td><td class="v">${esc(b.vendor)}</td><td class="r">${inr(b.amount)}</td>${tds?`<td class="r">${inr(b.tds)}</td><td class="r b">${inr(netOf(b))}</td>`:''}<td>${esc(b.utr)}</td><td>${b.approvers.map(r=>esc(b.ap[r].by||'')).join(', ')}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="3">Total · ${list.length} transaction${list.length===1?'':'s'}</td><td class="r">${inr(G)}</td>${tds?`<td class="r">${inr(T)}</td><td class="r">${inr(G-T)}</td>`:''}<td colspan="2"></td></tr></tfoot></table>`
    :`<div class="empty">No transactions in ${monthName(m)}.${keys.length?' Pick another month above.':' Completed payments will appear here.'}</div>`;
  return `<div class="bar"><b style="font-size:16px">Transactions</b><span class="sp"></span><label style="margin:0">Month&nbsp;</label><input type="month" id="mp" data-sel="month" value="${m}" style="width:auto"></div>
    ${keys.length?`<div class="bar">${keys.map(k=>`<button class="tab ${k===m?'on':''}" data-act="month" data-id="${k}">${monthName(k)} <span class="mute">${counts[k]}</span></button>`).join('')}</div>`:''}
    <div class="stats"><div class="kv"><small>Transactions done · ${monthName(m)}</small><b>${list.length}</b></div><div class="kv"><small>Gross amount</small><b>${inr(G)}</b></div>${tds?`<div class="kv"><small>TDS deducted</small><b>${inr(T)}</b></div><div class="kv"><small>Net paid</small><b>${inr(G-T)}</b></div>`:''}</div>
    <div class="card tw">${table}</div>`;
}

function activityView(){
  let ev=S.bills.flatMap(b=>b.log.filter(l=>seesTds(S.user)||!l.priv).map(l=>({...l,vendor:b.vendor,id:b.id})));
  const names=[...new Set([...USERS.map(x=>x.name),...ev.map(e=>e.who)])];
  if(S.actUser) ev=ev.filter(e=>e.who===S.actUser);
  ev.sort((a,b)=>b.t.localeCompare(a.t));
  return `<div class="bar"><b style="font-size:16px">Activity log</b><span class="sp"></span><label style="margin:0">Employee&nbsp;</label>
    <select data-sel="actUser"><option value="">Everyone</option>${names.map(n=>`<option value="${esc(n)}" ${S.actUser===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div>
    <div class="card tw">${ev.length?`<table class="act"><thead><tr><th>When</th><th>Employee</th><th>Role</th><th>What happened</th><th>Bill</th></tr></thead><tbody>
    ${ev.map(e=>`<tr data-act="open" data-id="${e.id}"><td style="white-space:nowrap">${fdt(e.t)}</td><td class="v">${esc(e.who)}</td><td>${e.role&&ROLE_LABEL[e.role]?ROLE_LABEL[e.role]:'<span class="mute">—</span>'}</td><td>${e.kind==='comment'?'💬 ':''}${esc(e.text)}</td><td>${esc(e.vendor)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No activity yet.</div>'}</div>`;
}

function loginView(){
  return `<div class="login"><form class="lbox" id="loginForm"><h1>Vendor <span style="color:var(--acc)">Payments</span></h1><p>Sign in to continue</p>
    <label>Username</label><input type="text" id="lu" autocomplete="username" autofocus>
    <label>Password</label><input type="password" id="lp" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="btn pri" style="width:100%;margin-top:6px" type="submit">Sign in</button></form></div>`;
}

function drawer(b){
  if(!b) return '';
  const u=S.user, st=status(b), sees=seesTds(u), isOps=u.role==='ops', isAcc=u.role==='accounts', open=!b.completedAt;
  const payForm = isAcc&&open&&allOk(b)&&!denied(b);
  /* who-did-what flow */
  const dr=b.approvers.find(r=>b.ap[r].s==='denied');
  const steps=[{t:'Bill added',sub:ROLE_LABEL.ops,who:b.createdBy,at:b.createdAt,state:'done'}];
  b.approvers.forEach(r=>{ const a=b.ap[r];
    steps.push({t:ROLE_LABEL[r],sub:'approval',who:a.by,at:a.at,state:a.s==='approved'?'done':a.s==='denied'?'bad':(!dr&&r===nextRole(b)?'now':'wait')}); });
  steps.push({t:'Payment',sub:ROLE_LABEL.accounts,who:b.completedBy,at:b.completedAt,state:b.completedAt?'done':(allOk(b)&&!dr?'now':'wait')});
  const flow=`<div class="flow">${steps.map((s,i)=>`<div class="fs ${s.state}"><div class="dot">${s.state==='done'?'✓':s.state==='bad'?'✗':i+1}</div><b>${s.t}</b><small>${s.sub}</small><small>${s.who&&s.at?esc(s.who)+'<br>'+fdt(s.at):(s.state==='now'?'⏳ Waiting now':'Waiting')}</small></div>`).join('')}</div>`;
  const step=(r,i)=>{ const a=b.ap[r], can=canAct(b,u)&&u.role===r;
    const prevOk=b.approvers.slice(0,i).every(x=>b.ap[x].s==='approved');
    return `<div class="step"><div class="n">${i+1}</div><div class="t"><b>${ROLE_LABEL[r]}</b> ${apill(a)}${a.by?`<small>${esc(a.by)} · ${fdt(a.at)}${a.note?' · “'+esc(a.note)+'”':''}</small>`:(!prevOk?`<small>Starts after ${ROLE_LABEL[b.approvers[0]]} approves</small>`:'')}</div>${can?approvalBox(b):''}</div>`; };
  const dh=b.dueHistory;
  const dueBlock = dh.length
    ? `<div class="box"><b>${fmtD(b.due)}</b> <span class="pill amber">Changed ${dh.length}×</span>${dh.map(x=>`<small class="mute" style="display:block">${fmtD(x.from)} → ${fmtD(x.to)} · ${esc(x.by)} · ${fdt(x.at)}</small>`).join('')}</div>`
    : `<div class="box"><b>${fmtD(b.due)}</b> <small class="mute">· not changed since the bill was added</small></div>`;
  let tdsBlock='';
  if(sees&&!payForm) tdsBlock=`<h3>TDS applied</h3><div class="box">${hasTds(b)?`<b>${inr(b.tds)}</b> <span class="mute">(${pctOf(b)}% of gross)</span><br>Net payable: <b>${inr(netOf(b))}</b>${b.tdsBy?`<small class="mute" style="display:block">Added by ${esc(b.tdsBy)} · ${fdt(b.tdsAt)}</small>`:''}`:'<span class="mute">Accounts adds the TDS when they make the payment.</span>'}</div>`;
  let pay='';
  if(b.completedAt) pay=`<div class="box"><b>UTR ${esc(b.utr)}</b><small class="mute" style="display:block">Paid on ${fdt(b.completedAt)}</small>${b.payRemarks?`<div style="margin-top:6px;white-space:pre-wrap"><small class="mute">Payment remarks</small><br>${esc(b.payRemarks)}</div>`:''}</div>`;
  else if(denied(b)) pay='<div class="mute">This bill was denied, so it cannot be paid.</div>';
  else if(!allOk(b)) pay='<div class="mute">Payment can be made once all required approvals are done.</div>';
  else if(isAcc) pay=`<div class="box"><div class="grid"><div class="kv"><small>Gross amount</small><b>${inr(b.amount)}</b></div><div class="kv"><small>Net payable</small><b id="pay-net">${hasTds(b)?inr(netOf(b)):'—'}</b></div></div>
      <label>TDS amount (₹) *</label><input type="number" id="pay-tds" min="0" step="0.01" value="${hasTds(b)?b.tds:''}" placeholder="Enter TDS (0 if none)">
      <div class="pcts">Quick-fill: <a data-act="tdspct" data-v="0.01">1%</a><a data-act="tdspct" data-v="0.02">2%</a><a data-act="tdspct" data-v="0.05">5%</a><a data-act="tdspct" data-v="0.1">10%</a></div>
      <label>UTR number *</label><input type="text" id="utr" placeholder="Enter UTR after payment" value="${esc(b.utr||'')}">
      <label>Payment remarks (optional)</label><textarea id="pay-rem" rows="2" placeholder="e.g. 75% paid, 25% balance to be paid next month">${esc(b.payRemarks||'')}</textarea>
      <div class="acts"><button class="btn pri" data-act="pay" data-id="${b.id}">Pay &amp; mark completed</button></div></div>`;
  else pay='<div class="mute">Approved. Waiting for Accounts to make the payment.</div>';
  const cms=b.log.filter(l=>l.kind==='comment');
  const sum = b.completedAt ? `<h3>Completion summary</h3><div class="box sum">
    <div><span>Vendor</span><b>${esc(b.vendor)}</b></div>
    <div><span>Due date</span><b>${fmtD(b.due)}${b.dueHistory.length?' (changed '+b.dueHistory.length+'×)':''}</b></div>
    <div><span>Gross amount</span><b>${inr(b.amount)}</b></div>
    ${sees?`<div><span>TDS</span><b>${inr(b.tds)}</b></div><div><span>Net payable</span><b>${inr(netOf(b))}</b></div>`:''}
    <div><span>UTR</span><b>${esc(b.utr)}</b></div>
    <div><span>Paid on</span><b>${fdt(b.completedAt)}</b></div>
    <div><span>Payment remarks</span><b style="text-align:right;white-space:pre-wrap">${b.payRemarks?esc(b.payRemarks):'—'}</b></div></div>
    ${cms.length?`<div class="box" style="margin-top:8px"><b>Comments (${cms.length})</b>${cms.map(l=>`<div style="margin-top:6px"><small class="mute">${esc(l.who)}${l.role&&ROLE_LABEL[l.role]?' ('+ROLE_LABEL[l.role]+')':''} · ${fdt(l.t)}</small><div style="white-space:pre-wrap">${esc(l.text)}</div></div>`).join('')}</div>`:''}
    ${sees?`<div class="acts" style="margin-top:10px"><button class="btn pri" data-act="pdf" data-id="${b.id}">⬇ Download Payment Advice (PDF)</button></div>`:''}` : '';
  const feed = visLog(b).map(l=>l.kind==='comment'
    ? `<li class="cm"><b>${esc(l.who)}</b>${l.role&&ROLE_LABEL[l.role]?` <span class="mute">(${ROLE_LABEL[l.role]})</span>`:''} <small style="display:inline">· ${fdt(l.t)}</small><div class="bub">${esc(l.text)}</div></li>`
    : `<li>${esc(l.text)}<small>${esc(l.who)}${l.role&&ROLE_LABEL[l.role]?' ('+ROLE_LABEL[l.role]+')':''} · ${fdt(l.t)}</small></li>`).join('');
  return `<div class="overlay" data-act="close"></div><aside class="drawer">
    <div class="dh"><h2>${esc(b.vendor)}</h2>${spill(st)}<button class="x" data-act="close">×</button></div>
    <div class="meta">Added by <b>${esc(b.createdBy)}</b>, ${fdt(b.createdAt)}<br>Last updated by <b>${esc(b.updatedBy)}</b>, ${fdt(b.updatedAt)}</div>
    ${flow}
    ${isOps&&open?`<div style="margin-bottom:12px"><button class="btn sm" data-act="edit" data-id="${b.id}">✎ Edit bill</button></div>`:''}
    <div class="grid"><div class="kv"><small>Gross amount</small><b>${inr(b.amount)}</b></div><div class="kv"><small>Due date</small><b>${fmtD(b.due)}</b></div>
      ${sees?`<div class="kv"><small>TDS</small><b>${hasTds(b)?inr(b.tds):'Not added yet'}</b></div><div class="kv"><small>Net payable</small><b>${hasTds(b)?inr(netOf(b)):'—'}</b></div>`:''}</div>
    <h3>Due date</h3>${dueBlock}
    <h3>Description</h3><div class="box" style="white-space:pre-wrap">${b.desc?esc(b.desc):'<span class="mute">No description.</span>'}</div>
    ${tdsBlock}
    ${b.collabs.length?`<h3>Collaborators</h3>${b.collabs.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}`:''}
    <h3>Bill document</h3>${b.doc?`<div class="prev" id="prev">${b.doc.type.startsWith('image/')?`<img src="${b.doc.data}" alt="">`:'<span class="mute">Loading preview…</span>'}</div><div class="note mute">${esc(b.doc.name)}</div>`:'<div class="mute">No document uploaded.</div>'}
    ${isOps&&open?`<label class="btn sm" style="display:inline-block;margin-top:8px">${b.doc?'Replace document':'⬆ Upload document'}<input type="file" id="d-file" accept="application/pdf,image/*" style="display:none"></label>`:''}
    <h3>Approval · ${apText(b.approvers)}</h3>${b.approvers.map(step).join('')}
    ${denied(b)&&isOps?`<div class="acts" style="margin-top:0"><button class="btn" data-act="resubmit" data-id="${b.id}">Resubmit for approval</button></div>`:''}
    <h3>Payment (Accounts)</h3>${pay}
    ${sum}
    <h3>Comments &amp; activity</h3><ul class="feed">${feed}</ul>
    <div class="cmbox"><textarea id="cm-in" rows="2" placeholder="Write a comment…"></textarea><button class="btn pri" data-act="comment" data-id="${b.id}">Comment</button></div>
  </aside>`;
}
async function previewPdf(b){
  const box=$('#prev'); if(!box) return;
  try{
    const lib=await pdfjs(); const pdf=await lib.getDocument({data:dataToBytes(b.doc.data)}).promise; const p=await pdf.getPage(1);
    const vp=p.getViewport({scale:1.4}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
    await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; box.innerHTML=''; box.appendChild(c);
  }catch(e){ box.innerHTML='<span class="mute">Preview not available.</span>'; }
}

/* ---------- New / edit bill form (Operations) ---------- */
function showModal(html){ $('#modal').innerHTML = `<div class="modal">${html}</div>`; }
function closeModal(){ $('#modal').innerHTML=''; S.draft=null; }
function billModal(b){
  const edit=!!b;
  S.draft={collabs:b?[...b.collabs]:[],doc:null,editId:b?b.id:null};
  const ap=b?(b.approvers.length>1?'both':b.approvers[0]):'both';
  showModal(`<div class="mbox"><h2><span>${edit?'Edit bill':'New vendor bill'}</span><button class="x" data-act="mclose">×</button></h2>
    ${edit?'':`<label style="margin-top:0">Bill document</label>
    <label class="drop" id="f-drop"><input type="file" id="f-file" accept="application/pdf,image/*"><div id="f-name">📄 <b>Click to upload</b> or drag &amp; drop the bill here<br><small>PDF or image · max 3 MB</small></div></label>
    <div class="note mute" id="f-st">The due date is read automatically from PDF bills.</div>`}
    <label ${edit?'style="margin-top:0"':''}>Name of the vendor *</label><input type="text" id="f-vendor" value="${esc(b?b.vendor:'')}">
    <label>Gross amount (₹) *</label><input type="number" id="f-amount" min="0" step="0.01" value="${b?b.amount:''}">
    <div class="note mute">TDS and net payable are added later by the Accounts team.</div>
    <label>Due date *</label><input type="date" id="f-due" value="${b?b.due:''}">
    <label>Description</label><textarea id="f-desc" rows="2" placeholder="Invoice no., what the payment is for…">${esc(b?b.desc:'')}</textarea>
    <label>Collaborators</label><div id="f-chips"></div><input type="text" id="f-collab" placeholder="Type a name or email and press Enter">
    <label>Who needs to approve? *</label>
    <div class="opts">
      <label class="opt"><input type="radio" name="fap" value="both" ${ap==='both'?'checked':''}> Both – ${ROLE_LABEL.pm}, then ${ROLE_LABEL.mm}</label>
      <label class="opt"><input type="radio" name="fap" value="pm" ${ap==='pm'?'checked':''}> ${ROLE_LABEL.pm} only</label>
      <label class="opt"><input type="radio" name="fap" value="mm" ${ap==='mm'?'checked':''}> ${ROLE_LABEL.mm} only</label>
    </div>
    ${edit?'<div class="note mute">Changing the vendor, gross amount or approvers after an approval will restart the approvals.</div>':''}
    <div class="err" id="f-err"></div>
    <div class="acts"><button class="btn" data-act="mclose">Cancel</button><button class="btn pri" data-act="save">${edit?'Save changes':'Send for approval'}</button></div></div>`);
  chips();
}
const chips = () => { $('#f-chips').innerHTML = S.draft.collabs.map((c,i)=>`<span class="chip">${esc(c)}<i data-act="rmchip" data-id="${i}">×</i></span>`).join(''); };
function addChip(){ const i=$('#f-collab'); const v=i.value.replace(/,$/,'').trim(); if(v&&!S.draft.collabs.includes(v)) S.draft.collabs.push(v); i.value=''; chips(); }

async function handleFile(file){
  const st=$('#f-st'); if(!file||!st) return;
  if(file.size>3*1024*1024){ st.textContent='File is over 3 MB – please upload a smaller file.'; st.style.color='var(--no)'; $('#f-file').value=''; return; }
  if(!(file.type==='application/pdf'||file.type.startsWith('image/'))){ st.textContent='Please upload a PDF or an image.'; st.style.color='var(--no)'; return; }
  st.style.color=''; st.textContent='Reading bill…';
  S.draft.doc = {name:file.name,type:file.type||'application/octet-stream',data:await readURL(file)};
  $('#f-drop').classList.add('has'); $('#f-name').innerHTML=`✅ <b>${esc(file.name)}</b><br><small>${Math.round(file.size/1024)} KB · click to replace</small>`;
  if(file.type==='application/pdf'){
    try{
      const d=findDue(await pdfText(await file.arrayBuffer()));
      if(d){ $('#f-due').value=d; st.innerHTML=`<span style="color:var(--ok)">Due date found: ${fmtD(d)}</span> – please confirm.`; }
      else st.textContent='Could not find a due date in this PDF – please enter it below.';
    }catch(e){ st.textContent='Could not read this PDF – please enter the due date below.'; }
  } else st.textContent='Image attached – please enter the due date below.';
}
async function attachDoc(file){
  const b=S.bills.find(x=>x.id===S.open); if(!file||!b) return;
  if(file.size>3*1024*1024) return toast('File is over 3 MB');
  if(!(file.type==='application/pdf'||file.type.startsWith('image/'))) return toast('Please upload a PDF or an image');
  const had=!!b.doc; b.doc={name:file.name,type:file.type,data:await readURL(file)};
  log(b,(had?'Replaced document: ':'Uploaded document: ')+file.name); save(); toast('Document uploaded'); render();
}

function saveBill(){
  if(S.user.role!=='ops') return;
  const v=$('#f-vendor').value.trim(), a=+$('#f-amount').value, due=$('#f-due').value, er=$('#f-err');
  const desc=$('#f-desc').value.trim(); addChip();
  if(!v) return er.textContent='Enter the vendor name.';
  if(!(a>0)) return er.textContent='Enter the gross amount.';
  if(!due) return er.textContent='Enter the due date.';
  const sel=document.querySelector('input[name=fap]:checked').value;
  const approvers = sel==='both'?[...ORDER]:[sel];
  const collabs=S.draft.collabs;
  if(!S.draft.editId){
    const b={id:Date.now().toString(36),vendor:v,amount:a,tds:null,due,desc,collabs,doc:S.draft.doc,createdBy:S.user.name,createdAt:new Date().toISOString(),
      approvers,ap:{pm:{s:'pending'},mm:{s:'pending'}},dueHistory:[],utr:'',completedAt:null,log:[]};
    log(b,'Added bill (gross '+inr(a)+'), approval: '+apText(approvers)+(b.doc?', document: '+b.doc.name:''));
    S.bills.push(b); save(); closeModal(); toast('Sent for approval'); render(); return;
  }
  const o=S.bills.find(x=>x.id===S.draft.editId), ch=[];
  if(v!==o.vendor) ch.push(`vendor “${o.vendor}” → “${v}”`);
  if(a!==o.amount) ch.push(`gross amount ${inr(o.amount)} → ${inr(a)}`);
  if(due!==o.due){ ch.push(`due date ${fmtD(o.due)} → ${fmtD(due)}`); o.dueHistory.push({from:o.due,to:due,by:S.user.name,at:new Date().toISOString()}); }
  if(desc!==o.desc) ch.push('description changed');
  if(collabs.join('|')!==o.collabs.join('|')) ch.push('collaborators changed');
  const apChanged = approvers.join()!==o.approvers.join();
  if(apChanged) ch.push(`approvers ${apText(o.approvers)} → ${apText(approvers)}`);
  if(!ch.length){ closeModal(); return toast('No changes made'); }
  const keyChanged = v!==o.vendor||a!==o.amount||apChanged;
  const started = ORDER.some(r=>o.ap[r].s!=='pending');
  Object.assign(o,{vendor:v,amount:a,due,desc,collabs:[...collabs],approvers});
  if(keyChanged&&started){ resetApprovals(o); ch.push('approvals restarted'); }
  log(o,'Edited: '+ch.join('; '));
  save(); closeModal(); toast('Changes saved'); render();
}

/* ---------- Events ---------- */
async function loadJsPdf(){
  if(window.jspdf) return window.jspdf.jsPDF;
  await new Promise((ok,bad)=>{ const t=document.createElement('script'); t.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; t.onload=ok; t.onerror=bad; document.head.appendChild(t); });
  return window.jspdf.jsPDF;
}
const rs = n => 'Rs. '+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
async function downloadPdf(b){
  let dl=null; try{ dl=window.claude?await window.claude.use('downloads'):null; }catch(e){}
  let J; try{ J=await loadJsPdf(); }catch(e){ return toast('Could not load the PDF tool – check your internet connection'); }
  const doc=new J({unit:'mm',format:'a4'}), W=210, M=18, LW=52; let y=22;
  const room=h=>{ if(y+h>280){ doc.addPage(); y=20; } };
  const head=t=>{ room(14); y+=4; doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(79,70,229); doc.text(t,M,y); y+=2; doc.setDrawColor(228,231,236); doc.line(M,y,W-M,y); y+=6; };
  const row=(l,v,bold)=>{ const lines=doc.splitTextToSize(String(v||'—'),W-M-M-LW); room(lines.length*5.5+2);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(107,115,133); doc.text(l,M,y);
    doc.setFont('helvetica',bold?'bold':'normal'); doc.setTextColor(28,34,48); doc.text(lines,M+LW,y); y+=lines.length*5.5+1.5; };
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(28,34,48); doc.text('Payment Advice',M,y); y+=7; doc.setProperties({title:'Payment Advice – '+b.vendor});
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(107,115,133); doc.text('Generated on '+fdt(new Date().toISOString()),M,y); y+=4;
  head('Bill details');
  row('Vendor',b.vendor,true); row('Description',b.desc); row('Due date',fmtD(b.due));
  head('Payment details');
  row('Gross amount',rs(b.amount)); row('TDS deducted',rs(b.tds)+'  ('+pctOf(b)+'% of gross)'); row('Net amount paid',rs(netOf(b)),true);
  row('UTR',b.utr,true); row('Paid on',fdt(b.completedAt),true); row('Status','Completed');
  head('Payment remarks'); row('Remarks',b.payRemarks||'—');
  const cms=b.log.filter(l=>l.kind==='comment');
  if(cms.length){ head('Comments'); cms.forEach(l=>row(fdt(l.t),(l.role&&ROLE_LABEL[l.role]?ROLE_LABEL[l.role]:'Team')+': '+l.text)); }
  const fn='Payment-Advice-'+b.vendor.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+new Date(b.completedAt).toISOString().slice(0,10)+'.pdf';
  const data=doc.output('arraybuffer');
  if(!dl){ /* normal website (e.g. GitHub Pages): plain browser download */
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/pdf'})); a.download=fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); toast('PDF downloaded'); return;
  }
  try{ await dl.save({filename:fn,data}); toast('PDF saved'); }
  catch(e){ toast(e&&e.code==='declined'?'Download cancelled':'Could not save the PDF'); }
}
const A = {
  view:el=>{S.view=el.dataset.id;S.open=null;render();},
  tab:el=>{S.filter=el.dataset.id;render();},
  open:el=>{S.open=el.dataset.id;S.denying=null;render();},
  close:()=>{S.open=null;S.denying=null;render();},
  logout:()=>{S.user=null;S.open=null;S.denying=null;store.set('session',null);closeModal();render();},
  mclose:()=>closeModal(),
  new:()=>billModal(),
  edit:el=>billModal(S.bills.find(b=>b.id===el.dataset.id)),
  rmchip:el=>{S.draft.collabs.splice(+el.dataset.id,1);chips();},
  save:()=>saveBill(),
  approve:el=>{S.denying=null;decide(el.dataset.id,'approved');},
  deny:el=>{S.denying=el.dataset.id;render();},
  dcancel:()=>{S.denying=null;render();},
  dconfirm:el=>{const n=el.closest('.denybox').querySelector('textarea').value.trim(); S.denying=null; decide(el.dataset.id,'denied',n);},
  resubmit:el=>{const b=S.bills.find(x=>x.id===el.dataset.id); resetApprovals(b); log(b,'Resubmitted for approval'); save(); toast('Resubmitted'); render();},
  tdspct:el=>{const b=S.bills.find(x=>x.id===S.open); $('#pay-tds').value=(b.amount*el.dataset.v).toFixed(2); $('#pay-net').textContent=inr(b.amount-$('#pay-tds').value);},
  layout:el=>{S.layout=el.dataset.id;render();},
  pdf:el=>{ const b=S.bills.find(x=>x.id===el.dataset.id); if(b&&b.completedAt&&seesTds(S.user)) downloadPdf(b); },
  month:el=>{S.month=el.dataset.id;render();},
  dbk:el=>{S.dbk=S.dbk===el.dataset.id?null:el.dataset.id;render();},
  dmon:el=>{S.dmonth=S.dmonth===el.dataset.id?'':el.dataset.id;S.dbk=null;render();},
  refresh:()=>{ S.bills=loadBills(); render(); setTimeout(()=>location.reload(),50); },
  dclear:()=>{S.dmonth='';S.dbk=null;render();},
  comment:el=>{
    const b=S.bills.find(x=>x.id===el.dataset.id), t=$('#cm-in').value.trim(); if(!t) return toast('Write a comment first');
    log(b,t,{kind:'comment'}); save(); render(); const d=$('.drawer'); if(d) d.scrollTop=d.scrollHeight;
  },
  pay:el=>{
    const b=S.bills.find(x=>x.id===el.dataset.id); if(!b||S.user.role!=='accounts'||b.completedAt||!allOk(b)||denied(b)) return;
    const raw=$('#pay-tds').value, utr=$('#utr').value.trim().toUpperCase(), rem=$('#pay-rem').value.trim();
    if(raw==='') return toast('Enter the TDS amount (0 if none)');
    const v=+raw; if(!(v>=0)||v>b.amount) return toast('TDS must be between 0 and the gross amount');
    if(!utr) return toast('Enter the UTR number');
    b.tds=v; b.tdsBy=S.user.name; b.tdsAt=new Date().toISOString();
    log(b,`TDS applied ${inr(v)} (${pctOf(b)}% of gross), net payable ${inr(b.amount-v)}`,{priv:true});
    b.utr=utr; b.payRemarks=rem; b.completedAt=new Date().toISOString(); b.completedBy=S.user.name;
    log(b,'Payment made – UTR '+utr+(rem?'. Remarks: '+rem:'')+'. Bill completed'); save(); toast('Payment recorded – moved to Completed'); render();
  }
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(el&&A[el.dataset.act]) A[el.dataset.act](el); });
async function makeHash(u,p){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u+':'+p)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginForm') return; e.preventDefault();
  const name=$('#lu').value.trim().toLowerCase(), pw=$('#lp').value.trim();
  let h=''; try{ h=await makeHash(name,pw); }catch(err){ return $('#lerr').textContent='Login needs a secure (https) page.'; }
  const u=USERS.find(x=>x.u===name&&x.h===h);
  if(!u) return $('#lerr').textContent='Incorrect username or password.';
  S.user={u:u.u,name:u.name,role:u.role}; store.set('session',{u:u.u}); S.bills=loadBills(); S.view='bills'; S.filter='all'; render();
});
document.addEventListener('input',e=>{
  if(e.target.id==='pay-tds'){ const b=S.bills.find(x=>x.id===S.open); if(b) $('#pay-net').textContent=e.target.value===''?'—':inr(b.amount-(+e.target.value||0)); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-file') handleFile(t.files[0]);
  if(t.id==='d-file') attachDoc(t.files[0]);
  if(t.dataset&&t.dataset.sel==='actUser'){ S.actUser=t.value; render(); }
  if(t.dataset&&t.dataset.sel==='month'){ S.month=t.value||null; render(); }
  if(t.dataset&&t.dataset.sel==='dmonth'){ S.dmonth=t.value||''; S.dbk=null; render(); }
});
document.addEventListener('keydown',e=>{ if(e.target.id==='f-collab'&&(e.key==='Enter'||e.key===',')){ e.preventDefault(); addChip(); } });
['dragover','dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{
  e.preventDefault(); const z=e.target.closest&&e.target.closest('#f-drop'); const d=$('#f-drop');
  if(t==='dragover'&&z) z.classList.add('over'); else if(d) d.classList.remove('over');
  if(t==='drop'&&z&&e.dataTransfer&&e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
}));
window.addEventListener('storage',e=>{ if(e.key==='bills'&&S.user&&!$('#modal').innerHTML&&!S.denying){ S.bills=loadBills(); render(); } });

render();
</script>
